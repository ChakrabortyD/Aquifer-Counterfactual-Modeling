name: Check dashboard

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python build_page.py --check
      - run: python -m py_compile build_page.py build_data.py
      - run: bash -n fetch_capsule.sh
